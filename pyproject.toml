[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gtt"
version = "0.2.0"
description = "Genomic Timepoint Tracker - transparent baseline-versus-follow-up VCF comparison"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gtt = "gtt.cli:main"

[tool.setuptools]
packages = ["gtt"]
